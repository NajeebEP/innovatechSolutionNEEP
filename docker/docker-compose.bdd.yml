# =============================================================
# docker-compose.bdd.yml
# Bases de datos — PostgreSQL 16 (una por microservicio)
# Levantar: docker compose -f docker-compose.bdd.yml up -d
# =============================================================

services:

  db-proyectos:
    image: postgres:16-alpine
    container_name: db-proyectos
    restart: unless-stopped
    environment:
      POSTGRES_DB: proyectos_db
      POSTGRES_USER: proyectos_user
      POSTGRES_PASSWORD: proyectos_pass
    ports:
      - "5432:5432"
    volumes:
      - db-proyectos-data:/var/lib/postgresql/data
      - ./db/proyectos/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proyectos_user -d proyectos_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - innovatech-net

  db-recursos:
    image: postgres:16-alpine
    container_name: db-recursos
    restart: unless-stopped
    environment:
      POSTGRES_DB: recursos_db
      POSTGRES_USER: recursos_user
      POSTGRES_PASSWORD: recursos_pass
    ports:
      - "5433:5432"
    volumes:
      - db-recursos-data:/var/lib/postgresql/data
      - ./db/recursos/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recursos_user -d recursos_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - innovatech-net

  db-analitica:
    image: postgres:16-alpine
    container_name: db-analitica
    restart: unless-stopped
    environment:
      POSTGRES_DB: analitica_db
      POSTGRES_USER: analitica_user
      POSTGRES_PASSWORD: analitica_pass
    ports:
      - "5434:5432"
    volumes:
      - db-analitica-data:/var/lib/postgresql/data
      - ./db/analitica/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analitica_user -d analitica_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - innovatech-net

volumes:
  db-proyectos-data:
  db-recursos-data:
  db-analitica-data:

networks:
  innovatech-net:
    external: true
