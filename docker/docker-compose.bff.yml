# =============================================================
# docker-compose.bff.yml
# Backend For Frontend (BFF)
# Spring Boot 3.2 / JDK 21 LTS / Puerto: 8084
# Requiere: docker-compose.eureka.yml y los 3 MS levantados
# Levantar: docker compose -f docker-compose.bff.yml up -d
# =============================================================

services:

  bff:
    build:
      context: ../bff
      dockerfile: Dockerfile
    container_name: bff
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8084

      # Service Discovery
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"

      # URLs de los microservicios
      MS_PROYECTOS_URL: http://ms-proyectos:8081
      MS_RECURSOS_URL: http://ms-recursos:8082
      MS_ANALITICA_URL: http://ms-analitica:8083

      # Circuit Breaker — Resilience4j 2.2
      # MS Proyectos
      RESILIENCE4J_CIRCUITBREAKER_INSTANCES_MS-PROYECTOS_SLIDING-WINDOW-SIZE: 10
      RESILIENCE4J_CIRCUITBREAKER_INSTANCES_MS-PROYECTOS_FAILURE-RATE-THRESHOLD: 50
      RESILIENCE4J_CIRCUITBREAKER_INSTANCES_MS-PROYECTOS_WAIT-DURATION-IN-OPEN-STATE: 10s
      RESILIENCE4J_CIRCUITBREAKER_INSTANCES_MS-PROYECTOS_PERMITTED-NUMBER-OF-CALLS-IN-HALF-OPEN-STATE: 3
      # MS Recursos
      RESILIENCE4J_CIRCUITBREAKER_INSTANCES_MS-RECURSOS_SLIDING-WINDOW-SIZE: 10
      RESILIENCE4J_CIRCUITBREAKER_INSTANCES_MS-RECURSOS_FAILURE-RATE-THRESHOLD: 50
      RESILIENCE4J_CIRCUITBREAKER_INSTANCES_MS-RECURSOS_WAIT-DURATION-IN-OPEN-STATE: 10s
      RESILIENCE4J_CIRCUITBREAKER_INSTANCES_MS-RECURSOS_PERMITTED-NUMBER-OF-CALLS-IN-HALF-OPEN-STATE: 3
      # MS Analítica
      RESILIENCE4J_CIRCUITBREAKER_INSTANCES_MS-ANALITICA_SLIDING-WINDOW-SIZE: 10
      RESILIENCE4J_CIRCUITBREAKER_INSTANCES_MS-ANALITICA_FAILURE-RATE-THRESHOLD: 50
      RESILIENCE4J_CIRCUITBREAKER_INSTANCES_MS-ANALITICA_WAIT-DURATION-IN-OPEN-STATE: 10s
      RESILIENCE4J_CIRCUITBREAKER_INSTANCES_MS-ANALITICA_PERMITTED-NUMBER-OF-CALLS-IN-HALF-OPEN-STATE: 3

      # Actuator
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus,metrics
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - innovatech-net

networks:
  innovatech-net:
    external: true
