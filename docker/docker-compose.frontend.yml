# =============================================================
# docker-compose.frontend.yml
# Frontend SPA — React 18.3 + Vite 5.x (servido con Nginx)
# Puerto: 3000 → http://localhost:3000
# Requiere: docker-compose.gateway.yml levantado
# Levantar: docker compose -f docker-compose.frontend.yml up -d
# =============================================================

services:

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # URL del API Gateway (punto de entrada único)
        VITE_API_URL: http://localhost:9000/api
        VITE_KEYCLOAK_URL: http://localhost:8080
        VITE_KEYCLOAK_REALM: innovatech
        VITE_KEYCLOAK_CLIENT_ID: innovatech-frontend
    container_name: frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - innovatech-net

networks:
  innovatech-net:
    external: true
