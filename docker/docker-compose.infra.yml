# =============================================================
# docker-compose.infra.yml
# Infraestructura transversal:
#   - Keycloak 24 (autenticación OAuth2/JWT) → http://localhost:8080
#   - MailHog (SMTP local gratuito)          → http://localhost:8025
# Levantar: docker compose -f docker-compose.infra.yml up -d
# =============================================================

services:

  # -----------------------------------------------------------
  # AUTENTICACIÓN — Keycloak 24 (gratuito, open source)
  # Admin: http://localhost:8080  usuario: admin / admin
  # -----------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      KC_DB: dev-mem          # Base en memoria (suficiente para dev)
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 10
    networks:
      - innovatech-net

  # -----------------------------------------------------------
  # SMTP LOCAL — MailHog (100% gratuito, reemplaza SendGrid)
  # SMTP: localhost:1025
  # Web UI para ver correos: http://localhost:8025
  # -----------------------------------------------------------
  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"   # Puerto SMTP
      - "8025:8025"   # Interfaz web
    networks:
      - innovatech-net

networks:
  innovatech-net:
    external: true
