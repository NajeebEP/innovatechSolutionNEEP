# =============================================================
# docker-compose.ms-analitica.yml
# Microservicio: Monitoreo y Analítica
# Spring Boot 3.2 / JDK 21 LTS / Puerto: 8083
# Requiere: docker-compose.bdd.yml, docker-compose.eureka.yml,
#           docker-compose.ms-proyectos.yml y
#           docker-compose.ms-recursos.yml levantados
# Levantar: docker compose -f docker-compose.ms-analitica.yml up -d
# =============================================================

services:

  ms-analitica:
    build:
      context: ../ms-analitica
      dockerfile: Dockerfile
    container_name: ms-analitica
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8083

      # Base de datos propia
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-analitica:5432/analitica_db
      SPRING_DATASOURCE_USERNAME: analitica_user
      SPRING_DATASOURCE_PASSWORD: analitica_pass
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"

      # Service Discovery
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"

      # URLs de los otros MS para consumir métricas vía REST
      # (No accede a sus BDs, solo a sus APIs)
      MS_PROYECTOS_URL: http://ms-proyectos:8081
      MS_RECURSOS_URL: http://ms-recursos:8082

      # Actuator
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus,metrics
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: always
    depends_on:
      db-analitica:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - innovatech-net

networks:
  innovatech-net:
    external: true
